{% csrf_token %}
{% if form.non_field_errors %}<div class="mensagem mensagem--erro">{{ form.non_field_errors }}</div>{% endif %}
{% for field in form %}
    <div class="form__campo">
        <label for="{{ field.id_for_label }}">{{ field.label }}</label>
        {{ field }}
        {% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}
        {{ field.errors }}
    </div>
{% endfor %}
