{% extends "base.html" %}
{% block title %}Vários alunos{% endblock %}

{% block content %}
<h1>Vários alunos — {{ turma.nome }}</h1>
<p>Cole os nomes, um por linha. Cada aluno ganha um usuário e uma senha, e depois é só imprimir os cartões.</p>

<form class="form form--obra" method="post" novalidate>
    {% include "escola/_form_campos.html" %}
    <button type="submit" class="btn">Cadastrar todos</button>
    <a href="{% url 'escola:turma' turma.pk %}">Cancelar</a>
</form>
{% endblock %}
